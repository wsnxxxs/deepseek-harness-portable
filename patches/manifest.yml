schemaVersion: 1
patches:
  - id: directory-picker-electron-ipc
    targets: [win32-x64, linux-x64]
    files:
      - path: node_modules/@deepseek-ai/dsh-host-directory-picker-native/lib/index.js
        guards:
          - spawnDialogWorker
          - pickNativeDirectory
      - path: node_modules/@deepseek-ai/dsh-host-directory-picker-native/lib/worker.cjs
        guards:
          - runFolderDialog
          - process.send
  - id: directory-picker-wsl-platform
    targets: ['*']
    files:
      - path: node_modules/@deepseek-ai/dsh-host-directory-picker-auto/lib/index.js
        guards:
          - resolveDirectoryPickerBackend
          - 'platform: process.platform'
          - hasLinuxChooserBinary
  - id: frontend-static-hashed-cache
    targets: ['*']
    files:
      - path: node_modules/@deepseek-ai/dsh-host-frontend-static/lib/index.js
        guards:
          - STATIC_MISS_CODES
          - serveStatic
          - 'res.writeHead(200, { "content-type": type });'
  - id: app-boot-profile-runtime-fallback
    targets: ['*']
    files:
      - path: node_modules/@deepseek-ai/dsh-app-boot/lib/index.js
        guards:
          - mountRootInclude
          - HostResolvedRootInclude
  - id: dsh-profile-stale-link-recovery
    targets: ['*']
    files:
      - path: node_modules/@deepseek-ai/dsh/lib/bin.js
        guards:
          - parseDshArgs
          - case "plugin"
          - runPlugin
  - id: portable-session-event-metadata
    targets: ['*']
    files:
      - path: node_modules/@deepseek-ai/dsh-session/lib/index.js
        guards:
          - KNOWN_SESSION_EVENT_TYPES
          - append(type, data, ...opts)
          - snapshotJsonValue
  - id: agent-team-tool-scope-isolation
    targets: ['*']
    files:
      - path: node_modules/@deepseek-ai/dsh-experimental-tool-agent-team/lib/index.js
        guards:
          - function apply(ctx, config = {})
          - for (const agent of ctx.agents.list()) maybeInstall(agent);
          - ctx.agentTeams.tryMembership(agent)
