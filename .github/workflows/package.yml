name: package-native

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/verify.yml

  windows-x64-wsl:
    needs: verify
    runs-on: [self-hosted, Windows, X64, dsh-wsl, inno-setup]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsx scripts/build/client-manifest-bridge.ts
      - shell: pwsh
        run: |
          if ((node -p "process.platform + '-' + process.arch") -ne 'win32-x64') { throw 'native win32-x64 runner required' }
          wsl.exe --status
          if ($LASTEXITCODE -ne 0) { throw 'working WSL distribution required' }
      - run: pnpm run desktop:package:win
      - uses: actions/upload-artifact@v4
        with:
          name: verified-win32-x64
          path: dist-desktop/electron/verified/win32-x64
          if-no-files-found: error
          compression-level: 0

  macos-arm64:
    needs: verify
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsx scripts/build/client-manifest-bridge.ts
      - name: Assert native macOS arm64 runner
        shell: bash
        run: |
          if [[ "$(node -p "process.platform + '-' + process.arch")" != 'darwin-arm64' ]]; then
            exit 1
          fi
      - run: pnpm run desktop:package:mac
      - uses: actions/upload-artifact@v4
        with:
          name: verified-darwin-arm64
          path: dist-desktop/electron/verified/darwin-arm64
          if-no-files-found: error
          compression-level: 0

  linux-x64:
    needs: verify
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsx scripts/build/client-manifest-bridge.ts
      - name: Assert native Linux x64 runner
        shell: bash
        run: |
          if [[ "$(node -p "process.platform + '-' + process.arch")" != 'linux-x64' ]]; then
            exit 1
          fi
      - run: pnpm run desktop:package:linux
      - uses: actions/upload-artifact@v4
        with:
          name: verified-linux-x64
          path: dist-desktop/electron/verified/linux-x64
          if-no-files-found: error
          compression-level: 0
