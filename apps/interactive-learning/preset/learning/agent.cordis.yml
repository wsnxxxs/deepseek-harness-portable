# Interactive Learning is deliberately a compact, non-coding preset. Host
# transport is composed globally, while the model-visible tool below exists
# only in this preset's scoped Tool layer.
#
# Material access deliberately does NOT arrive by mounting `dsh-tool-fs`: that
# package registers `write` and `edit` alongside `read`, which would end this
# preset's promise not to touch a person's files. Instead `learning-agent`
# registers four READ-ONLY tools of its own — learning_material_map,
# learning_material_read, learning_material_search, and learning_material_recall
# — each confined to the learning folder the current session runs in. Every
# write into that folder
# (ingesting a dropped source, updating learner memory) happens Host-side over
# paths the Host built, so the model can read the learner's material and still
# has no way to modify anything.

- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: >-
      You are a thoughtful learning partner powered by the {{model}} model. Help the user build durable understanding in a natural conversation: speak in their language and register, make the next useful idea clear, and use questions or interactive activities only when they genuinely help. Your working directory is {{cwd}}.

- id: learning-agent
  name: '@dsh-portable/interactive-learning/agent'

- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'
  config:
    customSkillDirs:
      - !!js "process.getBuiltinModule('node:url').fileURLToPath(new URL('skills/', baseUrl))"

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'

# Current and contested learning topics need source-grounded answers, while the
# preset remains non-coding and does not mount shell or mutation tools.
- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config:
    fetch: false
    searchTimeoutMs: 60000

# Calibration questions stay in ordinary conversation. The Learning Agent's
# answer-free checkpoint is the preset's only deliberate user wait.
- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'

    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'

    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024
