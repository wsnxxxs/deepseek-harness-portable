# The `crew` agent preset: mission work coordinated on a shared task board.
#
# This file is an AGENT-PLANE composition, mounted ONCE under a standing scope;
# every session naming it joins by scope parentage. The same rules as the other
# presets apply: a row that PROVIDES a service must sit inside a group carrying
# an `isolate` realm, or `dsh-agent-presets` rejects the mount.
#
# ── Why the Team SERVICE is not here ────────────────────────────────────────
#
# `@deepseek-ai/dsh-experimental-agent-team` provides `agentTeams`, and it is a
# HOST-plane row (see `apps/runtime/src/packaged-bin.ts`) for exactly the reason
# `goals` is: the Gateway serves the team domain as Remote endpoints whose
# receiver comes from a generated descriptor with `invocation: { kind: 'direct' }`,
# so it resolves `agentTeams` on the HOST context. An entry-local realm here
# would hide it and every browser call would answer `service-unavailable`, while
# a row without a realm is refused at mount. There is no third option, and the
# browser needs those endpoints: on this preset the task board is a shared
# human/agent artifact, not a read-out of what the model did.
#
# What this file contributes is the model-facing half: ten Team tools that
# resolve that host service up the scope chain.

# ── identity ────────────────────────────────────────────────────────────────

- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: |
      You are DSH's Lead coordinator in 集群模式, the DCode 集群编排 workbench powered by the {{model}} model. Your working directory is {{cwd}}. Own the task from investigation through verification and final synthesis. Prefer evidence from this workspace over assumptions, and communicate with the user in the user's language.

      Phase 0 — intent classification and admission check:
      - Conversational questions, greetings, and general explanations: answer directly. Do not create a Team, write a task board, or run a performance loop.
      - T0 mechanical apply: a fully specified edit or command; execute it directly and verify the result.
      - T1 bounded change: one coherent feature or fix; keep execution direct or use one implementer, then review and verify it.
      - T2 complex multi-file work: use a planner, scoped implementer work, independent reviewer, verifier, and the relevant performance gates.
      - T3 broad or cross-surface work: use recursive scope/feature coordinators, parallel implementer lanes in isolated worktrees, a reviewer/verifier gate, juror adjudication, and a goal-check sweep before answering.

      DCode 集群编排流程:
      1. Investigate the current behavior and trace the deepest actionable root cause before deciding the wave.
      2. For delegated work, create shared board tasks first. Every task needs an owner or intended role, acceptance criteria, dependencies, and advisory workspace-relative write scopes.
      3. Spawn named teammates with the role that matches the work: coordinator/scope-coordinator/feature-coordinator for decomposition, planner for read-only research, implementer for edits/tests, reviewer for independent read-only review, verifier for real validation, depth-prober for root-cause tracing, juror for independent adjudication, and goal-checker for the final request audit.
      4. Spawn all independent members of the current wave, then collect their reports. Use send_message for durable quiet information, followup_task to wake an inactive member, and wait_agent only when another required member is running or provisioning.
      5. Treat the board as the plan of record. Re-read task revisions before updates, claim work before execution, keep statuses current, and resolve write-scope warnings instead of ignoring them.
      6. A reviewer or verifier rejection is a backtrack signal: reopen or update the owning task, send the concrete failure back, and run the affected wave again. Do not paper over failures or declare success from narration alone.
      7. Record performance_gate receipts for the applicable G0/G1/G2/G3.5/G4/G5/G6/G7, sweep, and goal-check boundaries. After required work converges, stop or interrupt members that cannot contribute, check the final diff and real validation output, and synthesize the answer yourself. Wait for every teammate the answer depends on before replying.

      Engineering and quality doctrine:
      - Use the smallest deterministic red-to-green validation loop available, then refactor without broadening scope.
      - Preserve contracts, persistence semantics, tool boundaries, runtime behavior, and existing tests outside the requested change.
      - Review claims against the actual diff and verify with real test, typecheck, build, runtime, or adversarial checks as appropriate.
      - Team members use a shared filesystem by default; request worktree isolation for parallel writers. Worktrees inherit the parent's current dirty/untracked state and retain their branch for inspection or integration. Shared edits still require disjoint scopes. Read FS_STALE_VERSION results and rebase before retrying.
      - Keep progress visible through the task board and plan tools; keep the final response concise and evidence-backed.

- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536

# ── shell ───────────────────────────────────────────────────────────────────

# The capability-selected shell row is appended from the variant fragment
# declared in mode.yml; this stable base carries no OS branch.

# ── filesystem ──────────────────────────────────────────────────────────────

- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

# ── background jobs ────────────────────────────────────────────────────────

- id: tool-jobs
  name: '@deepseek-ai/dsh-tool-jobs'

# ── skills ──────────────────────────────────────────────────────────────────

- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'

# ── goals ───────────────────────────────────────────────────────────────────

- id: tool-goal
  name: '@deepseek-ai/dsh-tool-goal'

# ── cross-session recall ────────────────────────────────────────────────────

# `sessionQuery` and its SQLite FTS5 backend are host-plane and already mounted
# by the base bundle; only this model-facing consumer is per-preset. It is in
# this mode and not the others because a crew Lead is the agent most often
# asked "did we already try this?" — and because a wrong answer there costs a
# teammate's whole run, not one tool call.
#
# Search degrades rather than fails when the FTS backend is unavailable: the
# service is always present, so the tools always load.
- id: tool-session-query
  name: '@deepseek-ai/dsh-tool-session-query'
  config:
    maxSearchResults: 100
    searchTimeoutMs: 30000

# ── mission dossier ─────────────────────────────────────────────────────────

# Three READ-ONLY tools over the documents the operator attached to this
# mission's workspace. The model can map, read and search them and cite the
# exact passage; it cannot put a file into the dossier, because a space is
# trustworthy precisely because the Host decides what goes in and where. The
# operator attaches from DCode's Agent Inspector.
- id: crew-dossier
  name: '@dsh-portable/crew-dossier'

# ── crew ────────────────────────────────────────────────────────────────────

# Deliberately NOT inside an isolate group: this row publishes no service. It
# installs scoped tools into each Team member's own agent context and resolves
# the host `agentTeams` up the scope chain, so a realm here would only hide the
# service it needs.
- id: tool-agent-team
  name: '@deepseek-ai/dsh-experimental-tool-agent-team'
  config:
    freshProvider: spawn
    forkProvider: fork
    autonomous: true
    roleCatalog: true

# ── plan mode ───────────────────────────────────────────────────────────────

- id: planning
  name: cordis:group
  group: true
  isolate:
    planMode: true
  config:
    - id: plan-mode
      name: '@deepseek-ai/dsh-plan-mode'
      config:
        section: |
              You are in plan mode. Stay in plan mode until exit_plan_mode succeeds or the user switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

              Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Do not spawn teammates or claim board tasks: delegation is execution. Reading the board and reading history are grounding, and are allowed. Prefer existing functions and patterns over new machinery.

              The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed to keep the tool catalog unchanged. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.

              Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where code lives or how current behavior works when you can find out.

              Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. Where the plan is meant to run as a crew, say which parts are parallel, what each depends on, and which paths each will write to, so the board can be written from the plan without re-deciding it. Keep it concise enough to review but detailed enough that another engineer can implement it without making design decisions.

              When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.

# ── compaction ──────────────────────────────────────────────────────────────

- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'

    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'

    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024

# ── delegation ──────────────────────────────────────────────────────────────

# `tool-subagent-control` and `tool-subagent-list-agents` are DELIBERATELY
# ABSENT, and `contract.composition.forbiddenRows` in mode.yml keeps them out.
# They register exactly `send_message`, `interrupt_agent` and `list_agents`,
# which `tool-agent-team` registers with Team semantics — a durable named
# roster instead of this turn's continuable children. Because they are PRESET
# rows in `standard`, omitting them here is the entire fix: no host patch, and
# every other mode keeps them untouched.
#
# Both subagent tools are `one-shot` so the host-plane `tool-subagent-report`
# contributes nothing here: it installs `report` only into CONTINUABLE children.
# Anonymous one-shot fan-out stays available for work too small to be a task;
# work worth tracking becomes a teammate and a board entry instead.
- id: delegation
  name: cordis:group
  group: true
  isolate:
    workflowEngine: true
  config:
    - id: tool-subagent
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: subagent
        modelSelectionSettings: true
        backgroundMode: one-shot

    - id: tool-subagent-fork
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: fork
        toolName: subagent_fork
        backgroundMode: one-shot

    - id: workflow-worker-thread
      name: '@deepseek-ai/dsh-workflow-worker-thread'
      config:
        provider: spawn

    - id: tool-workflow
      name: '@deepseek-ai/dsh-tool-workflow'

    - id: tool-ralph
      name: '@deepseek-ai/dsh-tool-ralph'
      config:
        subagentProvider: spawn
        maxRounds: 64

# ── remaining model-facing rows ─────────────────────────────────────────────

- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true

- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config:
    fetch: false
    searchTimeoutMs: 60000
